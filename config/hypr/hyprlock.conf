$font = JetBrainsMono Nerd Font
$red = rgb(225, 37, 27)
$white = rgb(224, 224, 224)
$muted = rgb(112, 112, 112)
$black = rgb(8, 9, 10)

general {
    hide_cursor = true
    grace = 2
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint or enter password
        present_message = Scanning...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = snap, 0.2, 0, 0, 1
    animation = fadeIn, 1, 2, snap
    animation = fadeOut, 1, 2, snap
    animation = inputFieldDots, 1, 2, snap
}

background {
    monitor =
    color = $black
}

label {
    monitor =
    text = $TIME
    color = $white
    font_size = 88
    font_family = $font
    position = 0, 285
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  /  %d %B %Y"
    color = $muted
    font_size = 14
    font_family = $font
    position = 0, 225
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 48
    outline_thickness = 1
    inner_color = rgb(14, 15, 16)
    outer_color = rgb(58, 58, 58)
    check_color = $red
    fail_color = $red
    font_color = $white
    font_family = $font
    placeholder_text = password or fingerprint
    fail_text =
    fade_on_empty = false
    rounding = 2
    dots_spacing = 0.35
    position = 0, 0
    halign = center
    valign = center
}
