$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 2
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint or enter password
        present_message = Scanning...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgb(15, 15, 15)
}

label {
    monitor =
    text = $TIME
    color = rgb(244, 222, 205)
    font_size = 72
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(192, 202, 245)
    font_size = 18
    font_family = $font
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    inner_color = rgba(24, 19, 33, 0.92)
    outer_color = rgb(86, 97, 173)
    check_color = rgb(84, 185, 157)
    fail_color = rgb(237, 116, 129)
    font_color = rgb(254, 255, 224)
    font_family = $font
    placeholder_text = <i>Scan fingerprint or enter password</i>
    fail_text = $PAMFAIL$FPRINTFAIL
    fade_on_empty = false
    rounding = 12
    dots_spacing = 0.3
    position = 0, -55
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb(192, 202, 245)
    font_size = 13
    font_family = $font
    position = 0, -105
    halign = center
    valign = center
}
